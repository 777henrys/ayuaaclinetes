<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Continuar</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#FBFBFD] min-h-screen flex items-center justify-center">

    <main class="w-full max-w-xl px-6">

        <div class="bg-white rounded-3xl shadow-sm p-10 text-center">

            <div class="flex justify-center mb-8">
                <img 
                    src="./assets/logo.svg" 
                    alt="Logo"
                    class="w-32"
                >
            </div>

            <h1 class="text-3xl font-semibold text-[#1D1D1F] mb-5">
                Siga hablando con su representante
            </h1>

            <p class="text-gray-500 text-base leading-7 mb-8">
                Para continuar con el proceso, siga hablando con su representante.
            </p>

            <button
                onclick="history.back()"
                class="px-6 py-3 rounded-full bg-[#0071e3] text-white font-medium hover:bg-[#0077ed] transition"
            >
                Volver
            </button>

        </div>

    </main>

</body>
</html>
